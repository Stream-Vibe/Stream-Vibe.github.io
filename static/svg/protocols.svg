<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1160 330" width="1160" height="330" font-family="Calibri, Carlito, 'Liberation Sans', Arial, sans-serif"><style>
.a { animation: fu .55s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
.pop { animation-name: pop; animation-duration: .5s; }
.lit { animation-name: lit; animation-duration: .35s; }
.fade { animation-name: fd; animation-duration: .6s; }
.grow { animation-name: grow; animation-duration: .7s; transform-origin: left center; }
@keyframes fu { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fd { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.2); } 70% { opacity: 1; transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes lit { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes grow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }
</style><rect width="1160" height="330" fill="#FFFFFF"/><g class="a fade" style="animation-delay:0.00s"><rect x="0" y="0" width="565" height="330" rx="16" fill="#2F6FDB" fill-opacity="0.06" stroke="#2F6FDB" stroke-opacity="0.5"/><text x="22" y="34" font-size="21" fill="#2F6FDB" font-weight="bold" text-anchor="start">Pointwise evaluation</text><text x="22" y="58" font-size="14.5" fill="#6B7280" font-weight="normal" text-anchor="start">gold or self history · independent probes</text></g><g class="a grow" style="animation-delay:0.20s"><line x1="40.0" y1="190" x2="525.0" y2="190" stroke="#1B2340" stroke-width="2"/></g><g class="a fade" style="animation-delay:0.40s"><rect x="161.25" y="168" width="48.5" height="44" rx="6" fill="#2F6FDB" fill-opacity="0.2"/><path d="M185.5 218 l6 8 l-6 8 l-6 -8 z" fill="#2F6FDB"/></g><g class="a fade" style="animation-delay:0.40s"><rect x="379.5" y="168" width="48.5" height="44" rx="6" fill="#2F6FDB" fill-opacity="0.2"/><path d="M403.75 218 l6 8 l-6 8 l-6 -8 z" fill="#2F6FDB"/></g><g class="a " style="animation-delay:0.70s"><line x1="185.5" y1="110" x2="185.5" y2="168" stroke="#1F9D55" stroke-width="2" stroke-dasharray="3 3"/><circle cx="185.5" cy="100" r="13" fill="#1F9D55"/><text x="185.5" y="106" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">+</text></g><g class="a " style="animation-delay:0.92s"><line x1="149.125" y1="110" x2="149.125" y2="168" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/><circle cx="149.125" cy="100" r="13" fill="#6B7280"/><text x="149.125" y="106" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">−</text></g><g class="a " style="animation-delay:1.14s"><line x1="294.625" y1="110" x2="294.625" y2="168" stroke="#6B7280" stroke-width="2" stroke-dasharray="3 3"/><circle cx="294.625" cy="100" r="13" fill="#6B7280"/><text x="294.625" y="106" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">−</text></g><g class="a " style="animation-delay:1.36s"><